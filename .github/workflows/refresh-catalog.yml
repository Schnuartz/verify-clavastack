name: Refresh signed Specter catalog

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check upstream signatures and refresh catalog
        run: |
          python tools/update_releases.py
          python tools/check_catalog.py
      - name: Commit new verified releases
        run: |
          if git diff --quiet; then
            echo 'No catalog changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release.json keys signatures
          git commit -m 'Refresh verified Specter release catalog'
          git push

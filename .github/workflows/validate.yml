name: Validate verifier

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify every committed signed release manifest
        run: python tools/check_catalog.py
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check vendor/bitsaga/sha256.js
      - name: Check site assets and links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          html = (root / 'index.html').read_text(encoding='utf-8')
          script = (root / 'app.js').read_text(encoding='utf-8')
          for name in re.findall(r"image: '([^']+)'", script):
              assert (root / 'assets' / name).is_file(), name
          for name in re.findall(r'href="(assets/[^"?]+)"', html):
              assert (root / name).is_file(), name
          assert 'https://github.com/Schnuartz/verify-clavastack' in script
          assert '\u2014' not in script and '\u2013' not in script
          print('OK: product images, favicon, repository link and dash style')
          PY
